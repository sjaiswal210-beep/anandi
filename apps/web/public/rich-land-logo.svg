<svg width="360" height="88" viewBox="0 0 360 88" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rich-Land Developers">
  <defs>
    <linearGradient id="rlGoldH" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="rlSlateH" x1="0" y1="0" x2="0" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Emblem -->
  <g transform="translate(8,8)">
    <rect x="1" y="1" width="70" height="70" rx="16" fill="url(#rlSlateH)" stroke="url(#rlGoldH)" stroke-width="2"/>
    <path d="M14 50 L28 38 L39 45 L50 33 L59 40" stroke="url(#rlGoldH)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M14 57 H59 M26 57 V51 M37 57 V53 M48 57 V51" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <text x="36" y="34" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="url(#rlGoldH)" letter-spacing="0.5">RL</text>
  </g>

  <!-- Wordmark -->
  <text x="94" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="0.5">RICH<tspan fill="url(#rlGoldH)">-</tspan>LAND</text>
  <text x="95" y="63" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="4.5">DEVELOPERS</text>
</svg>
